name: Android APK

on:
  push:
    branches:
      - main
      - arena/9417a58a-waraq-app
    # Cutting a tag (v4.2.0) publishes a versioned GitHub release.
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # The repo ships only Dart sources: generate the Android host project in a
      # scratch directory so nothing in lib/, test/ or pubspec.yaml is touched.
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name waraq --org com.waraq /tmp/scaffold
          cp -r /tmp/scaffold/android ./
          sed -i 's/android:label="waraq"/android:label="Waraq"/' android/app/src/main/AndroidManifest.xml
          # pdfx and the rest of the plugin set are built against NDK 27.
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

      # Signs with the project keystore when WARAQ_SIGNING_B64 is configured,
      # otherwise falls back to the debug key so forks still produce an APK.
      - name: Configure release signing
        id: signing
        env:
          SIGNING_B64: ${{ secrets.WARAQ_SIGNING_B64 }}
        run: python3 tool/android/install_signing.py

      - name: Versions
        run: |
          flutter --version
          java -version

      - run: flutter pub get

      # Analyze/test output is mirrored into a commit comment as well: action logs
      # are not reachable from every environment, and these failures used to be
      # silent.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter compact 2>&1 | tee /tmp/test.log

      - name: Report analysis or test failure
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI check failure"
            if [ "${{ steps.analyze.outcome }}" = "failure" ]; then
              echo ""
              echo "flutter analyze:"
              echo '```'
              tail -c 30000 /tmp/analyze.log
              echo '```'
            fi
            if [ "${{ steps.test.outcome }}" = "failure" ]; then
              echo ""
              echo "flutter test:"
              echo '```'
              tail -c 30000 /tmp/test.log
              echo '```'
            fi
          } > /tmp/report.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/report.md)" >/dev/null

      - name: Fail when analysis or tests failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee /tmp/build.log

      # Action logs are not reachable from every environment, so the tail of the
      # Gradle output is mirrored into a commit comment where it can be read.
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(printf 'CI build failure\n\n```\n%s\n```' "$(tail -c 40000 /tmp/build.log)")" >/dev/null

      - name: Fail when the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Collect output
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/waraq.apk
          ls -lh dist

      - name: Verify signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/waraq.apk | tee /tmp/certs.txt
          FINGERPRINT=$(grep -m1 'SHA-256 digest' /tmp/certs.txt | sed 's/.*: //')
          echo "CERT_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $FINGERPRINT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: waraq-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to "apk-latest" release
        if: github.ref == 'refs/heads/arena/9417a58a-waraq-app' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            KEY_NOTE="Signed with the project release key."
          else
            KEY_NOTE="**Debug-signed** (no release key configured)."
          fi
          NOTES=$(printf '%s\n\n' \
            "Release build of the Flutter app." \
            "" \
            "**Install:** download \`waraq.apk\`, allow installs from unknown sources, open it." \
            "$KEY_NOTE" \
            "Certificate SHA-256: \`${CERT_FINGERPRINT}\`" \
            "" \
            "Android 5.0+ · arm64 / armv7 / x86_64 · commit ${GITHUB_SHA}")
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest dist/waraq.apk --clobber
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest dist/waraq.apk \
              --title "Waraq — latest test build" \
              --notes "$NOTES" \
              --latest
          fi

      # Tagging vX.Y.Z turns the same binary into an immutable, versioned
      # release, which is what "cut a release" means for testers.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            KEY_NOTE="Signed with the project release key."
          else
            KEY_NOTE="**Debug-signed** (no release key configured)."
          fi
          ASSET="dist/waraq-$VERSION.apk"
          cp dist/waraq.apk "$ASSET"
          {
            printf 'Waraq %s — release build (Flutter, release mode).\n\n' "$VERSION"
            printf '**Install:** download `waraq-%s.apk`, allow installs from unknown sources, open it.\n\n' "$VERSION"
            printf '%s\n' "$KEY_NOTE"
            printf 'Certificate SHA-256: `%s`\n\n' "$CERT_FINGERPRINT"
            printf 'Android 5.0+ · arm64 / armv7 / x86_64 · commit %s\n\n' "$GITHUB_SHA"
            printf '### What is inside\n'
            printf -- '- Rubik + Cairo typography, Material You colour, Shape & Motion settings\n'
            printf -- '- Reader: paged and continuous modes, bookmarks, page notes\n'
            printf -- '- Notes tab: search every note, jump back to its page\n'
            printf -- '- Backup & restore as a single `.waraq.zip`\n'
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "Waraq $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest
