plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.waraq'
version = '0.1.0'

android {
  namespace "com.waraq.rn"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // استخراج النص لوضع القراءة النصي — نفس مكتبة التطبيق الأصلي (Apache-2.0).
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
