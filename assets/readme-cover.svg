      <stop offset="0" stop-color="#234B3B"/>
      <stop offset="1" stop-color="#2F604B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EA"/>
