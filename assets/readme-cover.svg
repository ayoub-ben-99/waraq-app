  <rect x="170" y="210" width="360" height="360" rx="72" fill="#F5EFDF" filter="url(#shadow)"/>
  <image x="202" y="242" width="296" height="296" preserveAspectRatio="xMidYMid meet" xlink:href="assets/icon.png"/>

  <text x="1080" y="360" fill="#F5EFDF" font-family="Noto Sans Arabic, Noto Sans, sans-serif" font-size="116" font-weight="700" text-anchor="middle" direction="rtl">وَرَق</text>
  <text x="660" y="445" fill="#C7E0B9" font-family="Noto Sans, sans-serif" font-size="34" letter-spacing="7">WARAQ</text>
