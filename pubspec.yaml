name: waraq
description: Waraq — a calm, local-first PDF reader with Material You theming.
publish_to: "none"
version: 4.1.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  # pdfx 2.11 uses the double-precision Matrix4 API that landed in 3.32.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Theming
  # Pinned: 1.9.0 moved its Android plugin to a Kotlin-DSL script that needs a
  # newer AGP/Kotlin toolchain than the current Flutter stable scaffold and fails
  # to compile (`Unresolved reference: compilerOptions`). Bump only together
  # with a Flutter upgrade that ships Kotlin >= 2.2.
  dynamic_color: 1.8.1

  # PDF rendering (BSD-3-Clause, no commercial licence required)
  pdfx: ^2.6.1

  # Platform + persistence
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample/

  # Rubik carries the Latin UI; Cairo takes over for Arabic glyphs through
  # fontFamilyFallback. Both are SIL-OFL (see assets/fonts/OFL-*.txt) and were
  # instanced to static weights from the Google Fonts variable originals.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
